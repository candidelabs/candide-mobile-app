name: candide_mobile_app
description: "Candide Wallet"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 0.2.0+23

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  # Essential
  web3dart: 2.7.0
  wallet_dart:
    git:
      url: https://github.com/candidelabs/wallet-dart.git
      ref: b0639ab3805e3916d16cb8255627df6f1bd91eab
  dio: ^5.4.1
  web_socket_channel: ^2.4.4
  http: ^1.2.1
  eth_sig_util: ^0.0.9
  walletconnect_dart: ^0.0.11
  walletconnect_flutter_v2: ^2.0.14
  # Auth
  biometric_storage: ^5.1.1-dev.2
  # State
  get: ^4.6.6
  event_bus: ^2.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.0.0
  # UI
  animations: ^2.0.11
  pinput: ^2.2.31
  flutter_awesome_alert_box: ^2.1.1
  bot_toast: ^4.1.3
  modal_bottom_sheet: ^3.0.0-pre
  qr_flutter: ^4.1.0
  lottie: ^2.0.0
  salomon_bottom_bar: ^3.3.2
  pull_to_refresh_flutter3: ^2.0.1
  blockies: ^0.1.2
  keyboard_actions: ^4.1.0
  onboarding: ^3.1.0
  cached_network_image: ^3.3.1
  expandable: ^5.0.1
  info_popup: ^2.4.6
  animated_emoji: ^1.0.1+2
  confetti: ^0.7.0
  # Typography
  phosphor_flutter: ^1.4.0
  font_awesome_flutter: ^10.1.0
  flutter_svg: ^1.1.1+1
  # Misc
  decimal: ^2.3.2
  url_launcher: ^6.1.5
  flutter_dotenv: ^5.0.2
  share_plus: ^7.0.2
  mobile_scanner: ^7.0.1
  intl: ^0.17.0
  logger: ^1.1.0
  package_info_plus: ^4.2.0
  pausable_timer: ^1.0.0+6
  short_uuids: ^2.0.0
  flutter_cache_manager: ^3.3.1
  permission_handler: ^12.0.1
  version: ^3.0.0
  device_info_plus: ^9.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/
    - .env
    - assets/ca/isrgrootx1.pem

  fonts:
    - family: Gilroy
      fonts:
        - asset: assets/fonts/Gilroy/Gilroy-Regular.ttf
    - family: GilroyBold
      fonts:
        - asset: assets/fonts/Gilroy/Gilroy-Bold.ttf
    - family: GilroyBlack
      fonts:
        - asset: assets/fonts/Gilroy/Gilroy-Black.ttf
    - family: ProcrastinatingPixie
      fonts:
        - asset: assets/fonts/ProcrastinatingPixie/ProcrastinatingPixie.ttf